<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash Royale — Novamato Esports</title>
    <link rel="icon" type="image/png" href="imagens/favicon2.jpeg">
    <link rel="stylesheet" href="styles.css?v=6000">
</head>
<body>
    <!-- Uniform Solid Header -->
    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="brand">
                <img src="imagens/favicon2.jpeg" alt="Novamato" class="brand-logo" onerror="this.style.display='none'">
                <span class="brand-title">NOVAMATO</span>
            </a>

            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">Início</a></li>
                <li><a href="cs2.html" class="nav-link">CS2</a></li>
                <li><a href="clash-royale.html" class="nav-link">Clash Royale</a></li>
                <li><a href="minecraft.html" class="nav-link">Minecraft</a></li>
            </ul>

            <div class="nav-actions">
                <button class="theme-btn" id="themeBtn" aria-label="Alternar Tema">🌓</button>
                <a href="https://discord.gg/Yk3yHaqqCX" target="_blank" class="btn btn-primary">Discord</a>
            </div>
        </div>
    </header>

    <!-- CR Hero -->
    <section class="hero-clean">
        <div class="container">
            <div class="hero-clean-content">
                <div class="hero-clean-pill">Elite 10,000+ Trophies</div>
                <h1 class="hero-clean-title">CLASH ROYALE <span>CLAN</span></h1>
                <p class="hero-clean-sub">Membros de topo da ladder com mais de 10.000 troféus.</p>
            </div>
        </div>
    </section>

    <!-- CR Roster Grid -->
    <section class="section">
        <div class="container">
            <div class="section-header">
                <div>
                    <h2 class="section-title">Membros do Clan</h2>
                    <p class="section-subtitle">Atletas da divisão de Clash Royale.</p>
                </div>
            </div>

            <div class="roster-grid" id="crGrid"></div>
        </div>
    </section>

    <!-- Modal -->
    <div class="modal" id="playerModal">
        <div class="modal-dialog">
            <button class="modal-close">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <span>© 2026 Novamato Esports — Clash Royale Division.</span>
            <a href="index.html" style="color: var(--accent); text-decoration: none;">← Página Inicial</a>
        </div>
    </footer>

    <script src="script.js?v=6000"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('crGrid');
            if (grid) {
                grid.innerHTML = '';
                ROSTER_DATA.clashRoyale.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    const avatarHtml = p.photo 
                        ? `<div class="card-avatar" style="background-image: url('${p.photo}');"></div>` 
                        : '';
                        
                    card.innerHTML = `
                        <div class="card-top">
                            ${avatarHtml}
                            <div>
                                <div class="card-name">${p.name}</div>
                                <div class="card-role">${p.role} · ${p.tag}</div>
                            </div>
                        </div>
                        <div class="card-bottom">
                            <span class="card-badge">Clash Royale</span>
                            <span style="font-weight: 600;">🏆 ${p.trophies}</span>
                        </div>
                    `;
                    card.addEventListener('click', () => openModal({ ...p, game: 'Clash Royale', type: 'clash' }));
                    grid.appendChild(card);
                });
            }
        });
    </script>
</body>
</html>
