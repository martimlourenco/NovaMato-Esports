<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash Royale — Novamato Esports</title>
    <link rel="icon" type="image/png" href="imagens/favicon2.jpeg">
    <link rel="stylesheet" href="styles.css?v=8000">
</head>
<body>

    <!-- Left Vertical Social Bar -->
    <div class="vertical-social-bar">
        <a href="https://discord.gg/Yk3yHaqqCX" target="_blank" class="v-social-link">Discord</a>
        <a href="https://www.youtube.com/@novamato3393" target="_blank" class="v-social-link">YouTube</a>
        <a href="https://steamcommunity.com/id/white1209/" target="_blank" class="v-social-link">Steam</a>
    </div>

    <!-- Centered Logo Top Navigation -->
    <header class="main-header">
        <div class="container" style="width: 100%;">
            <nav class="nav-grid">
                <ul class="nav-group">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="cs2.html" class="nav-link">CS2</a></li>
                    <li><a href="clash-royale.html" class="nav-link active">Clash Royale</a></li>
                </ul>

                <a href="index.html" class="nav-center-logo">
                    <img src="imagens/favicon2.jpeg" alt="Novamato Logo" class="center-logo-img" onerror="this.style.display='none'">
                </a>

                <ul class="nav-group">
                    <li><a href="minecraft.html" class="nav-link">Minecraft</a></li>
                    <li><a href="index.html#about" class="nav-link">About</a></li>
                    <li><a href="https://discord.gg/Yk3yHaqqCX" target="_blank" class="nav-link">Discord</a></li>
                </ul>

                <button class="theme-toggle-btn" id="themeBtn" aria-label="Alternar Tema">🌓</button>
            </nav>
        </div>
    </header>

    <!-- Page Hero -->
    <section class="esports-hero" style="min-height: 60vh; padding-top: 140px;">
        <div class="hero-vignette"></div>
        <div class="container">
            <div class="hero-content">
                <div class="hero-kicker">Elite 10,000+ Trophies Clan</div>
                <h1 class="hero-main-title">Clash Royale<br><span style="color: var(--neon-green);">Clan Roster</span></h1>
            </div>
        </div>
    </section>

    <!-- Clan Members Grid -->
    <section class="about-section" style="background: var(--bg-darker); border-top: 1px solid var(--border-color);">
        <div class="container">
            <div class="section-center-heading">
                <h2 class="heading-title">Clan <span class="highlight-green">Members</span></h2>
                <div class="heading-line"></div>
            </div>

            <div class="roster-grid" id="crGrid"></div>
        </div>
    </section>

    <!-- Player Details Modal -->
    <div class="modal" id="playerModal">
        <div class="modal-content">
            <button class="modal-close-btn">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Site Footer -->
    <footer class="site-footer">
        <div class="container footer-flex">
            <span>© 2026 Novamato Esports — Clash Royale Division.</span>
            <div class="footer-links">
                <a href="index.html" class="footer-link">Home</a>
                <a href="cs2.html" class="footer-link">CS2</a>
                <a href="minecraft.html" class="footer-link">Minecraft</a>
                <a href="https://discord.gg/Yk3yHaqqCX" target="_blank" class="footer-link">Discord</a>
            </div>
        </div>
    </footer>

    <script src="script.js?v=8000"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('crGrid');
            if (grid) {
                grid.innerHTML = '';
                ROSTER_DATA.clashRoyale.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'squad-card';
                    
                    const avatarHtml = p.photo 
                        ? `<div class="player-avatar-box" style="background-image: url('${p.photo}');"></div>` 
                        : '';
                        
                    card.innerHTML = `
                        <div class="card-header-flex">
                            ${avatarHtml}
                            <div>
                                <div class="player-info-title">${p.name}</div>
                                <div class="player-info-role">${p.role} · ${p.tag}</div>
                            </div>
                        </div>
                        <div class="card-footer-flex">
                            <span class="squad-badge">Clash Royale</span>
                            <span class="squad-stat">🏆 ${p.trophies}</span>
                        </div>
                    `;
                    card.addEventListener('click', () => openModal({ ...p, game: 'Clash Royale', type: 'clash' }));
                    grid.appendChild(card);
                });
            }
        });
    </script>
</body>
</html>
