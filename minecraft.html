    <!-- Top Header Navigation -->
    <header class="site-header">

    <!-- Page Hero -->

        <div class="giant-bg-text" style="top: 50%;">CRAFT</div>

        <div class="container" style="position: relative; z-index: 10; text-align: center;">
            <div class="hero-cs2-pill">Dedicated Minecraft Server & Dynmap</div>
            <h1 style="font-family: var(--font-heading); font-size: clamp(2.4rem, 5.5vw, 4rem); font-weight: 900; text-transform: uppercase;">

            </h1>

    <!-- IP Box -->
    <section class="section-dominate">
        <div class="container">
            <div class="mc-banner-dominate">
                <div>

                    <div class="mc-banner-ip">46.224.145.80:25565</div>

    <!-- Dynmap Embed Frame -->

            <div class="section-title-wrap">

                <iframe src="http://46.224.145.80:8123" style="width: 100%; height: 100%; border: none;" title="Minecraft Dynmap"></iframe>
