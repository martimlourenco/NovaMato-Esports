<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Division — Novamato Esports</title>
    <link rel="icon" type="image/png" href="imagens/favicon2.jpeg">
    <link rel="stylesheet" href="styles.css?v=9000">
</head>
<body>

    <!-- Top Header Navigation -->
    <header class="site-header">
        <div class="container header-container">
            <a href="index.html" class="header-brand">
                <span class="brand-badge">CS2</span>
                <span class="brand-name">NOVAMATO</span>
            </a>

            <ul class="main-nav">
                <li><a href="index.html" class="nav-item-link">Home</a></li>
                <li><a href="cs2.html" class="nav-item-link active">CS2</a></li>
                <li><a href="clash-royale.html" class="nav-item-link">Clash Royale</a></li>
                <li><a href="minecraft.html" class="nav-item-link">Minecraft</a></li>
            </ul>

            <div class="header-right-actions">
                <a href="https://discord.gg/Yk3yHaqqCX" target="_blank" class="btn-header-signin">Discord</a>
                <button class="btn-header-icon" id="themeBtn" aria-label="Alternar Tema">🌓</button>
            </div>
        </div>
    </header>

    <!-- CS2 Page Hero -->
    <section class="hero-dominate" style="min-height: 55vh; padding-top: 130px; justify-content: center;">
        <div class="giant-bg-text" style="top: 50%;">CS2</div>
        <div class="hero-vignette"></div>

        <div class="container" style="position: relative; z-index: 10; text-align: center;">
            <div class="hero-cs2-pill">Tactical 5v5 FPS Division</div>
            <h1 style="font-family: var(--font-heading); font-size: clamp(2.4rem, 5.5vw, 4rem); font-weight: 900; text-transform: uppercase;">
                Counter-Strike 2 <span style="color: var(--accent-red);">Roster</span>
            </h1>
        </div>
    </section>

    <!-- Video Clutch Section -->
    <section class="section-dominate">
        <div class="container">
            <div class="section-title-wrap">
                <div class="sec-kicker">Highlight de Jogo</div>
                <h2 class="sec-heading">Team <span>Clutch</span></h2>
            </div>

            <div class="video-highlight-wrap" style="max-width: 960px; margin: 0 auto;">
                <video controls autoplay muted loop>
                    <source src="imagens/videocs2.mp4" type="video/mp4">
                </video>
            </div>
        </div>
    </section>

    <!-- 12 Players Grid -->
    <section class="section-dominate" style="background: var(--bg-darker); border-top: 1px solid var(--border-color);">
        <div class="container">
            <div class="section-title-wrap">
                <div class="sec-kicker">12 CS2 Athletes</div>
                <h2 class="sec-heading">Official <span>Line-up</span></h2>
            </div>

            <div class="roster-grid-dominate" id="cs2Grid"></div>
        </div>
    </section>

    <!-- Player Details Modal -->
    <div class="modal" id="playerModal">
        <div class="modal-content">
            <button class="modal-close-btn">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Site Footer -->
    <footer class="site-footer">
        <div class="container footer-flex">
            <span>© 2026 Novamato Esports — Counter-Strike 2 Division.</span>
            <div class="footer-links">
                <a href="index.html" class="footer-link">Home</a>
                <a href="clash-royale.html" class="footer-link">Clash Royale</a>
                <a href="minecraft.html" class="footer-link">Minecraft</a>
                <a href="https://discord.gg/Yk3yHaqqCX" target="_blank" class="footer-link">Discord</a>
            </div>
        </div>
    </footer>

    <script src="script.js?v=9000"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('cs2Grid');
            if (grid) {
                grid.innerHTML = '';
                ROSTER_DATA.cs2.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'card-dominate';
                    card.innerHTML = `
                        <div class="card-dominate-top">
                            <div class="card-dominate-avatar" style="background-image: url('${p.photo}');"></div>
                            <div>
                                <div class="card-dominate-name">${p.name}</div>
                                <div class="card-dominate-role">${p.role}</div>
                            </div>
                        </div>
                        <div class="card-dominate-bottom">
                            <span class="badge-dominate">CS2</span>
                            <span class="stat-dominate">Rating: ${p.rating}</span>
                        </div>
                    `;
                    card.addEventListener('click', () => openModal({ ...p, game: 'CS2', type: 'cs2' }));
                    grid.appendChild(card);
                });
            }
        });
    </script>
</body>
</html>
