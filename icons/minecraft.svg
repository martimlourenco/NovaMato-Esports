<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Iconic Minecraft Grass Block with isometric top -->
  <!-- Top Grass Surface (Vibrant Green) -->
  <rect x="5" y="4" width="22" height="6" fill="#4ade80"/>
  <rect x="6" y="5" width="20" height="4" fill="#22c55e"/>
  <rect x="7" y="6" width="18" height="2" fill="#16a34a"/>
  <!-- Grass Highlights & Bits -->
  <rect x="8" y="5" width="2" height="2" fill="#86efac"/>
  <rect x="18" y="6" width="3" height="1" fill="#86efac"/>
  <rect x="13" y="4" width="2" height="2" fill="#15803d"/>

  <!-- Grass Hanging Roots / Dripping Pixels -->
  <rect x="5" y="10" width="22" height="2" fill="#15803d"/>
  <rect x="7" y="12" width="2" height="2" fill="#15803d"/>
  <rect x="12" y="12" width="3" height="3" fill="#15803d"/>
  <rect x="18" y="12" width="2" height="2" fill="#15803d"/>
  <rect x="23" y="12" width="2" height="3" fill="#15803d"/>

  <!-- Dirt Layer (Rich Brown with stone/dirt pixels) -->
  <rect x="5" y="12" width="22" height="15" fill="#78350f"/>
  <rect x="6" y="13" width="20" height="13" fill="#92400e"/>
  
  <!-- Dirt Pixel Variations -->
  <rect x="7" y="16" width="3" height="3" fill="#451a03"/>
  <rect x="14" y="15" width="2" height="2" fill="#451a03"/>
  <rect x="20" y="18" width="3" height="2" fill="#451a03"/>
  <rect x="10" y="22" width="2" height="2" fill="#451a03"/>
  <rect x="17" y="23" width="3" height="2" fill="#451a03"/>
  
  <rect x="11" y="18" width="2" height="2" fill="#b45309"/>
  <rect x="16" y="19" width="2" height="2" fill="#b45309"/>
  <rect x="23" y="21" width="2" height="2" fill="#b45309"/>
  <rect x="7" y="24" width="2" height="1" fill="#b45309"/>

  <!-- Black Border Outline -->
  <rect x="4" y="3" width="24" height="1" fill="#000000"/>
  <rect x="4" y="27" width="24" height="1" fill="#000000"/>
  <rect x="4" y="3" width="1" height="25" fill="#000000"/>
  <rect x="27" y="3" width="1" height="25" fill="#000000"/>
</svg>