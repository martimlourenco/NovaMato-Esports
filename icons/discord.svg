<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Discord Official Clyde Pixel Art -->
  <!-- Blurple Rounded Disc / Tile -->
  <rect x="2" y="2" width="28" height="28" fill="#5865F2" rx="6"/>
  
  <!-- Clyde White Gamepad Head -->
  <rect x="7" y="10" width="18" height="12" fill="#ffffff"/>
  <rect x="6" y="12" width="20" height="8" fill="#ffffff"/>
  
  <!-- Left & Right Ears / Antennas -->
  <rect x="8" y="8" width="4" height="3" fill="#ffffff"/>
  <rect x="20" y="8" width="4" height="3" fill="#ffffff"/>
  
  <!-- Bottom Controller Legs -->
  <rect x="8" y="21" width="4" height="4" fill="#ffffff"/>
  <rect x="20" y="21" width="4" height="4" fill="#ffffff"/>
  
  <!-- Inner Bottom Arch Cutout -->
  <rect x="13" y="19" width="6" height="4" fill="#5865F2"/>
  <rect x="14" y="18" width="4" height="2" fill="#5865F2"/>

  <!-- Left Eye -->
  <rect x="10" y="14" width="3" height="4" fill="#5865F2"/>
  <rect x="11" y="15" width="1" height="2" fill="#313338"/>

  <!-- Right Eye -->
  <rect x="19" y="14" width="3" height="4" fill="#5865F2"/>
  <rect x="20" y="15" width="1" height="2" fill="#313338"/>

  <!-- 3D Bevel -->
  <path d="M2 2h28v1H2z M2 2v28h1V2z" fill="rgba(255,255,255,0.4)"/>
  <path d="M29 3v27h1V2h-1z M2 29h28v1H2z" fill="rgba(0,0,0,0.3)"/>
</svg>