<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Golden Trophy Cup (Match Results / Hall of Fame) -->
  <!-- Background Dark Disc -->
  <circle cx="16" cy="16" r="14" fill="#0f172a"/>
  
  <!-- Trophy Cup Body (Gold / Yellow Shades) -->
  <rect x="10" y="5" width="12" height="2" fill="#ffd700"/>
  <rect x="9" y="7" width="14" height="2" fill="#f59e0b"/>
  <rect x="8" y="9" width="16" height="4" fill="#fbbf24"/>
  <rect x="10" y="13" width="12" height="3" fill="#f59e0b"/>
  <rect x="12" y="16" width="8" height="2" fill="#d97706"/>
  <rect x="14" y="18" width="4" height="2" fill="#b45309"/>
  
  <!-- Trophy Highlights -->
  <rect x="10" y="9" width="2" height="4" fill="#ffffff"/>
  <rect x="11" y="7" width="2" height="2" fill="#ffffff"/>
  
  <!-- Left Handle -->
  <rect x="5" y="8" width="3" height="2" fill="#f59e0b"/>
  <rect x="5" y="10" width="2" height="5" fill="#f59e0b"/>
  <rect x="7" y="14" width="2" height="2" fill="#f59e0b"/>
  
  <!-- Right Handle -->
  <rect x="24" y="8" width="3" height="2" fill="#d97706"/>
  <rect x="25" y="10" width="2" height="5" fill="#d97706"/>
  <rect x="23" y="14" width="2" height="2" fill="#d97706"/>

  <!-- Stem & Base -->
  <rect x="15" y="20" width="2" height="3" fill="#b45309"/>
  <rect x="12" y="23" width="8" height="2" fill="#d97706"/>
  <rect x="9" y="25" width="14" height="3" fill="#1e293b"/>
  <rect x="11" y="26" width="10" height="1" fill="#94a3b8"/>

  <!-- Winner Star in center -->
  <rect x="15" y="10" width="2" height="2" fill="#ffffff"/>
  <rect x="14" y="11" width="4" height="1" fill="#ffffff"/>
  <rect x="15" y="9" width="2" height="4" fill="#ffffff"/>
</svg>