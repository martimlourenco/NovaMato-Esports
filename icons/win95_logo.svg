<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Iconic Windows 95 / 98 4-Color Waving Flag -->
  <!-- Top Left: Red Tile -->
  <rect x="7" y="6" width="8" height="8" fill="#ef4444"/>
  <rect x="8" y="7" width="6" height="6" fill="#f87171"/>
  
  <!-- Top Right: Green Tile -->
  <rect x="17" y="6" width="8" height="8" fill="#22c55e"/>
  <rect x="18" y="7" width="6" height="6" fill="#4ade80"/>

  <!-- Bottom Left: Blue Tile -->
  <rect x="7" y="16" width="8" height="8" fill="#0284c7"/>
  <rect x="8" y="17" width="6" height="6" fill="#38bdf8"/>

  <!-- Bottom Right: Yellow Tile -->
  <rect x="17" y="16" width="8" height="8" fill="#eab308"/>
  <rect x="18" y="17" width="6" height="6" fill="#fde047"/>

  <!-- Pixel Grid Divider Separators -->
  <rect x="15" y="5" width="2" height="20" fill="#000000"/>
  <rect x="6" y="14" width="20" height="2" fill="#000000"/>

  <!-- Trailing Black Pixel Dots -->
  <rect x="4" y="8" width="2" height="2" fill="#000000"/>
  <rect x="3" y="12" width="2" height="2" fill="#000000"/>
  <rect x="5" y="18" width="2" height="2" fill="#000000"/>
  <rect x="26" y="8" width="2" height="2" fill="#000000"/>
  <rect x="27" y="18" width="2" height="2" fill="#000000"/>
  <rect x="12" y="26" width="2" height="2" fill="#000000"/>
  <rect x="18" y="26" width="2" height="2" fill="#000000"/>
</svg>