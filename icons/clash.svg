<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Clash Royale Royal King Crown with Ruby -->
  <circle cx="16" cy="16" r="14" fill="#0b132b"/>
  
  <!-- Crown Base Band -->
  <rect x="5" y="21" width="22" height="5" fill="#f59e0b"/>
  <rect x="6" y="22" width="20" height="3" fill="#fbbf24"/>
  <rect x="7" y="23" width="18" height="1" fill="#fef08a"/>
  
  <!-- Crown Spikes (3 Main Peaks) -->
  <!-- Left Peak -->
  <rect x="5" y="11" width="4" height="10" fill="#f59e0b"/>
  <rect x="6" y="9" width="2" height="2" fill="#ffd700"/>
  <rect x="6" y="7" width="2" height="2" fill="#38bdf8"/> <!-- Blue Gem -->

  <!-- Right Peak -->
  <rect x="23" y="11" width="4" height="10" fill="#d97706"/>
  <rect x="24" y="9" width="2" height="2" fill="#f59e0b"/>
  <rect x="24" y="7" width="2" height="2" fill="#38bdf8"/> <!-- Blue Gem -->

  <!-- Center Big Peak -->
  <rect x="13" y="9" width="6" height="12" fill="#f59e0b"/>
  <rect x="14" y="6" width="4" height="3" fill="#ffd700"/>
  <rect x="15" y="4" width="2" height="2" fill="#ffd700"/>

  <!-- Center Big Ruby Gemstone (Red/Pink Diamond) -->
  <rect x="15" y="12" width="2" height="6" fill="#ef4444"/>
  <rect x="14" y="13" width="4" height="4" fill="#ef4444"/>
  <rect x="15" y="13" width="2" height="2" fill="#fca5a5"/>
  <rect x="13" y="14" width="6" height="2" fill="#dc2626"/>

  <!-- Left & Right Inset Spikes -->
  <rect x="9" y="15" width="4" height="6" fill="#b45309"/>
  <rect x="19" y="15" width="4" height="6" fill="#b45309"/>

  <!-- Small Base Jewels -->
  <rect x="9" y="23" width="2" height="2" fill="#38bdf8"/>
  <rect x="15" y="23" width="2" height="2" fill="#ef4444"/>
  <rect x="21" y="23" width="2" height="2" fill="#38bdf8"/>
</svg>